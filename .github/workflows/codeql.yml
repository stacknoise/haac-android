name: CodeQL

# Replaces the CodeQL default setup: it analysed Kotlin without a build ("none" mode) and found no code.
# java-kotlin is built with Gradle, actions needs no build.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
        if: matrix.language == 'java-kotlin'
        with:
          cache-disabled: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # The tracer must see every compile step: no daemon, no build cache, tasks always run.
      - name: Build both flavors (play, sideload)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --rerun-tasks
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          category: "/language:${{ matrix.language }}"

name: Release

# Builds the signed sideload APK for a version tag and attaches it, with its SHA-256, to the GitHub Release.
# Also builds the signed Play bundle (AAB) of the same tag; it is kept as a workflow artifact for the upload to Google Play.
# Run it by hand ("Run workflow") with the tag to build a release for a tag that already exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  apk:
    name: Signed APK and Play bundle
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6
        with:
          # The job holds the signing secrets: no build cache is read or written (review S-13).
          cache-disabled: true
      - name: versionName equals tag (concept 16.4)
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::appVersion ${version} does not match tag ${TAG}"
            exit 1
          fi
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HAAC_KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/haac-release.jks"
          echo "HAAC_KEYSTORE_FILE=${RUNNER_TEMP}/haac-release.jks" >> "${GITHUB_ENV}"
      - name: Build signed sideload APK and Play bundle
        env:
          HAAC_KEYSTORE_PASSWORD: ${{ secrets.HAAC_KEYSTORE_PASSWORD }}
          HAAC_KEY_ALIAS: ${{ secrets.HAAC_KEY_ALIAS }}
          HAAC_KEY_PASSWORD: ${{ secrets.HAAC_KEY_PASSWORD }}
        run: ./gradlew assembleSideloadRelease bundlePlayRelease
      - name: Name the APK, verify the signature, write the checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "dist/haac-${TAG}-sideload.apk"
          apksigner=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)
          "${apksigner}" verify --print-certs "dist/haac-${TAG}-sideload.apk"
          (cd dist && sha256sum "haac-${TAG}-sideload.apk" > "haac-${TAG}-sideload.apk.sha256")
      - name: Name the Play bundle and verify its signature
        env:
          HAAC_KEYSTORE_PASSWORD: ${{ secrets.HAAC_KEYSTORE_PASSWORD }}
          HAAC_KEY_ALIAS: ${{ secrets.HAAC_KEY_ALIAS }}
        run: |
          mkdir bundle
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "bundle/haac-${TAG}-play.aab"
          jarsigner -verify -certs "bundle/haac-${TAG}-play.aab"
          keytool -list -keystore "${HAAC_KEYSTORE_FILE}" -storepass "${HAAC_KEYSTORE_PASSWORD}" -alias "${HAAC_KEY_ALIAS}" | tail -n 2
      - name: Keep the Play bundle for the upload to Google Play
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: haac-${{ env.TAG }}-play-bundle
          path: bundle/haac-${{ env.TAG }}-play.aab
          retention-days: 30
      - name: Keep the R8 mapping files for Play crash reports (concept 13.3)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: haac-${{ env.TAG }}-r8-mapping
          path: |
            app/build/outputs/mapping/playRelease/mapping.txt
            app/build/outputs/mapping/sideloadRelease/mapping.txt
          retention-days: 90
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 \
            || gh release create "${TAG}" --verify-tag --generate-notes --title "${TAG}"
          gh release upload "${TAG}" dist/* --clobber

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PMD_VERSION: "7.28.0"
  # SHA-256 of pmd-dist-<PMD_VERSION>-bin.zip; update both together (review S-13).
  PMD_SHA256: "f974ba571f7bc01c73fffe11bade25fbc1f438698f9e9c00e416e8d65e9fbac2"

jobs:
  build:
    name: Build, lint, detekt, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6
      - name: Build both flavors (play, sideload)
        run: ./gradlew assembleDebug
      - name: Android Lint
        run: ./gradlew lint
      - name: Detekt
        run: ./gradlew detekt
      - name: Unit tests
        run: ./gradlew test
      - name: Code index up to date (concept 17.5)
        run: ./gradlew codeIndexCheck
      - name: Build-logic tests (code index generator)
        run: ./gradlew -p build-logic test
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7

  cpd:
    name: Copy-paste detection (CPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PMD
        run: |
          curl -sSL -o pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          echo "${PMD_SHA256}  pmd.zip" | sha256sum --check --strict
          unzip -q pmd.zip
      - name: CPD (fails from 100 duplicated tokens, concept 17.6)
        run: |
          "pmd-bin-${PMD_VERSION}/bin/pmd" cpd --language kotlin --minimum-tokens 100 \
            --dir app/src --dir core --dir feature --format text

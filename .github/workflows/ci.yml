name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PMD_VERSION: "7.28.0"

jobs:
  build:
    name: Build, lint, detekt, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build both flavors (play, sideload)
        run: ./gradlew assembleDebug
      - name: Android Lint
        run: ./gradlew lint
      - name: Detekt
        run: ./gradlew detekt
      - name: Unit tests
        run: ./gradlew test
      - name: Code index up to date (concept 17.5)
        run: ./gradlew codeIndexCheck
      - name: Build-logic tests (code index generator)
        run: ./gradlew -p build-logic test
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7

  cpd:
    name: Copy-paste detection (CPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PMD
        run: |
          curl -sSL -o pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          unzip -q pmd.zip
      - name: CPD (fails from 100 duplicated tokens, concept 17.6)
        run: |
          "pmd-bin-${PMD_VERSION}/bin/pmd" cpd --language kotlin --minimum-tokens 100 \
            --dir app/src --dir core --dir feature --format text

# Overrides on top of Detekt's default configuration (concept 17.6).

comments:
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true

# TooManyFunctions stays at the default (11). ViewModels with one small handler per input, DAOs and repositories
# with one function per operation may exceed it with @Suppress("TooManyFunctions") and a reason (development guide).
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/ui/theme/**']
  MaxLineLength:
    maxLineLength: 120
